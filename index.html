<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f2">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141414">
<title>豆档 · 咖啡豆录入</title>
<link rel="stylesheet" href="./preview.css">
<script type="module" src="./preview.mjs?v=3"></script>
</head>
<body>
<header class="site-header">
<nav class="shell bar" aria-label="豆档导航">
<span id="brand" class="brand" hidden>豆档</span>
<button id="library-toggle" type="button">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
我的豆库
</button>
</nav>
</header>
<main class="shell">
<section id="editor">
<h1 id="editor-title" tabindex="-1">添加咖啡豆</h1>
<p class="intro" id="editor-intro">拍下包装标签，核对识别结果后保存。</p>
<button id="show-capture" type="button" aria-controls="capture" hidden>豆袋照片与识别</button>
<div class="layout">
<aside class="capture" id="capture">
<div class="viewfinder">
<svg viewBox="0 0 310 170" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path opacity=".55" d="M45 48V24h24m172 0h24v24m0 74v24h-24m-172 0H45v-24"/><rect x="107" y="43" width="96" height="84" rx="5"/><path d="M122 59h66m-66 15h44m-44 22h63m-63 14h38"/><path class="scan-line" d="M36 84h238"/></svg>
</div>
<div class="capture-actions">
<button id="camera-open" class="primary" type="button" aria-describedby="recognition-note">拍照识别</button>
<button id="gallery-open" class="quiet" type="button" aria-describedby="recognition-note">相册识别</button>
</div>
<p class="capture-note" id="recognition-note">用于识别的照片会发送给 GLM。</p>
<div class="capture-alternatives">
<button id="manual-entry" class="quiet" type="button">手动录入</button>
<button id="cover-open" class="quiet" type="button">仅保存封面</button>
</div>
<input id="cover-file" type="file" accept="image/*" hidden>
<input id="camera" type="file" accept="image/*" capture="environment" hidden>
<input id="gallery" type="file" accept="image/*" hidden>
<p id="scan-status" role="status"></p>
<button id="cancel-scan" class="quiet" type="button" hidden>停止识别，手动录入</button>
<details id="raw" hidden><summary>查看识别原文</summary><pre id="raw-text"></pre></details>
</aside>
<form id="entry">
<section id="ocr-review" class="review-panel" aria-labelledby="ocr-heading" hidden>
<h2 id="ocr-heading">核对识别结果</h2>
<p id="ocr-progress" role="status"></p><div id="ocr-fields"></div>
</section>
<section id="stock-conflict" class="review-panel" aria-labelledby="stock-conflict-title" hidden>
<h2 id="stock-conflict-title" tabindex="-1">核对库存余量</h2>
<p id="stock-conflict-message"></p>
<button id="use-stock" type="button">采用当前库存</button>
<button id="confirm-stock" type="button">确认新余量</button>
</section>
<div id="fields"></div>
<button id="discard-draft" type="button" hidden>丢弃草稿</button>
<footer><p id="save-status" role="status"></p><button class="primary" type="submit">保存豆档</button></footer>
</form>
</div>
</section>
<section id="library" hidden>
<div class="library-heading">
<div><h1 id="library-title" tabindex="-1">我的豆库</h1><p class="library-count">共 <span id="count">0</span> 份豆档 · 共 <span id="stock-total">0</span>&nbsp;g 库存</p></div>
<button class="primary" id="new-entry" type="button">添加咖啡豆</button>
</div>
<div class="library-feedback"><p id="library-status" role="status"></p><button id="undo-deduct" type="button" hidden>撤销减豆</button></div>
<div id="library-tools" class="library-tools" hidden>
<label for="library-search" class="sr-only">搜索豆库</label><input id="library-search" type="search" placeholder="搜索名称、产地或烘焙商">
<label for="library-filter" class="sr-only">库存状态</label><select id="library-filter"><option value="">全部库存</option><option value="available">还有余量</option><option value="empty">已用完</option></select>
</div>
<div id="entries"></div>
</section>
</main>
<dialog id="deleted-editor" aria-labelledby="deleted-editor-title" aria-describedby="deleted-editor-note">
<h2 id="deleted-editor-title">这条豆档已被删除</h2>
<p id="deleted-editor-note">可以返回豆库，或将当前内容另存为一条新的豆档。</p>
<div class="dialog-actions"><button id="deleted-editor-back" type="button" autofocus>返回豆库</button><button id="save-as-new" class="primary" type="submit" form="entry">另存为新豆档</button></div>
</dialog>
<dialog id="delete-bean" aria-labelledby="delete-bean-title" aria-describedby="delete-bean-message">
<h2 id="delete-bean-title">删除豆档？</h2>
<p id="delete-bean-message"></p>
<p id="delete-bean-error" role="status"></p>
<div class="dialog-actions"><button id="cancel-delete-bean" type="button" autofocus>取消</button><button id="confirm-delete-bean" class="danger-button" type="button">确认删除</button></div>
</dialog>
<dialog id="discard-confirm" aria-labelledby="discard-title">
<h2 id="discard-title">丢弃草稿？</h2>
<p>本次未保存的修改会被清除。</p>
<div class="dialog-actions"><button type="button" id="keep-draft" autofocus>继续编辑</button><button class="primary" type="button" id="confirm-discard">丢弃草稿</button></div>
</dialog>
<dialog id="deduct" aria-labelledby="deduct-title"><form id="deduct-form">
<h2 id="deduct-title">减豆</h2>
<p id="deduct-stock"></p>
<label for="deduct-grams">用掉的克数（g）</label>
<input id="deduct-grams" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="例如 18" required autofocus>
<button id="recent-dose" type="button" hidden></button>
<p id="deduct-preview" role="status"></p>
<p id="deduct-error" role="status"></p>
<div class="dialog-actions"><button type="button" id="deduct-cancel">取消</button><button class="primary" type="submit">确认减豆</button></div>
</form></dialog>
</body></html>
